<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドローン画像 作物識別システム</title>
    <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #1a1a2e; }
        #map { width: 100%; height: 100vh; }

        .panel {
            position: absolute;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            z-index: 1000;
        }

        #controls-panel {
            top: 10px;
            left: 10px;
            width: 240px;
        }

        #stats-panel {
            bottom: 36px;
            left: 10px;
            width: 200px;
        }

        #legend-panel {
            bottom: 36px;
            right: 10px;
            width: 160px;
        }

        .panel-title {
            font-size: 15px;
            font-weight: bold;
            color: #1a1a2e;
            margin: 0 0 4px 0;
        }

        .panel-subtitle {
            font-size: 11px;
            color: #888;
            margin: 0 0 12px 0;
        }

        .panel h3 {
            margin: 0 0 10px 0;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            padding-bottom: 6px;
            border-bottom: 1px solid #eee;
        }

        .form-label {
            display: block;
            font-size: 12px;
            color: #555;
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
            margin-bottom: 10px;
            color: #333;
            background: #fafafa;
        }

        .basemap-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }

        .basemap-toggle button {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            color: #555;
            transition: all 0.15s;
        }

        .basemap-toggle button.active {
            background: #1a1a2e;
            color: #fff;
            border-color: #1a1a2e;
        }

        .filter-section-title {
            font-size: 12px;
            color: #555;
            margin: 0 0 6px 0;
            font-weight: bold;
        }

        .crop-filter-row {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 2px 0;
        }

        .crop-filter-swatch {
            width: 13px;
            height: 13px;
            border-radius: 3px;
            flex-shrink: 0;
            opacity: 0.85;
        }

        .crop-filter-row label {
            font-size: 12px;
            color: #444;
            cursor: pointer;
        }

        .crop-filter-row input[type="checkbox"] {
            cursor: pointer;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .stat-row:last-child { border-bottom: none; }

        .stat-label {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #555;
        }

        .stat-swatch {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .stat-value {
            font-weight: bold;
            color: #333;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            font-size: 12px;
            color: #444;
        }

        .legend-swatch {
            width: 16px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
            opacity: 0.8;
        }

        /* Popup styles */
        .maplibregl-popup-content {
            padding: 14px 16px;
            font-size: 13px;
            min-width: 180px;
            border-radius: 8px;
        }

        .popup-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .popup-color-bar {
            width: 5px;
            height: 36px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        .popup-crop-name {
            font-size: 15px;
            font-weight: bold;
            color: #1a1a2e;
        }

        .popup-score-label {
            font-size: 11px;
            color: #888;
        }

        .popup-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 3px 0;
            font-size: 12px;
            border-bottom: 1px solid #f5f5f5;
        }

        .popup-row:last-child { border-bottom: none; }

        .popup-key { color: #777; }
        .popup-val { font-weight: bold; color: #333; }

        .confidence-bar-wrap {
            height: 6px;
            background: #ebebeb;
            border-radius: 3px;
            margin: 4px 0 10px 0;
            overflow: hidden;
        }

        .confidence-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .popup-note {
            margin-top: 8px;
            font-size: 11px;
            color: #888;
            background: #f9f9f9;
            border-radius: 4px;
            padding: 5px 7px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Controls Panel -->
    <div class="panel" id="controls-panel">
        <div class="panel-title">作物識別システム</div>
        <div class="panel-subtitle">ドローン画像 AI解析結果ビューア</div>

        <span class="form-label">調査エリア・日付</span>
        <select id="surveySelector">
            <option value="crop_sample">2024年 十勝平野（サンプル）</option>
        </select>

        <span class="form-label">ベースマップ</span>
        <div class="basemap-toggle">
            <button id="btnSatellite" class="active" onclick="setBasemap('satellite')">航空写真</button>
            <button id="btnMap" onclick="setBasemap('map')">地図</button>
        </div>

        <div class="filter-section-title">作物種別フィルター</div>
        <div id="crop-filters"></div>
    </div>

    <!-- Statistics Panel -->
    <div class="panel" id="stats-panel">
        <h3>集計</h3>
        <div id="stats-content">
            <div style="font-size:12px;color:#aaa;">読み込み中...</div>
        </div>
    </div>

    <!-- Legend Panel -->
    <div class="panel" id="legend-panel">
        <h3>凡例</h3>
        <div id="legend-content"></div>
    </div>

    <script>
        // ── 作物スタイル定義 ──────────────────────────────────────
        const cropStyles = {
            wheat:   { color: "#D4AC0D", label: "小麦" },
            potato:  { color: "#E67E22", label: "じゃがいも" },
            beet:    { color: "#C0392B", label: "てんさい" },
            soybean: { color: "#27AE60", label: "大豆" },
            corn:    { color: "#F39C12", label: "とうもろこし" },
            rice:    { color: "#1E8449", label: "水稲" },
            onion:   { color: "#8E44AD", label: "たまねぎ" },
            adzuki:  { color: "#6E2C00", label: "小豆" }
        };

        // 全カテゴリ初期状態は表示ON
        const cropFilters = Object.fromEntries(Object.keys(cropStyles).map(k => [k, true]));

        // ── マップ初期化 ──────────────────────────────────────────
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    satellite: {
                        type: 'raster',
                        tiles: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'],
                        tileSize: 256,
                        attribution: "地図：<a href='https://www.gsi.go.jp/' target='_blank'>国土地理院</a>",
                        minzoom: 2,
                        maxzoom: 18
                    },
                    standardmap: {
                        type: 'raster',
                        tiles: ['https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png'],
                        tileSize: 256,
                        attribution: "地図：<a href='https://www.gsi.go.jp/' target='_blank'>地理院タイル</a>",
                        minzoom: 5,
                        maxzoom: 18
                    }
                },
                layers: [
                    { id: 'satellite-layer', type: 'raster', source: 'satellite', layout: { visibility: 'visible' } },
                    { id: 'map-layer',       type: 'raster', source: 'standardmap', layout: { visibility: 'none' } }
                ]
            },
            hash: true,
            zoom: 13,
            center: [143.446, 42.887],
            attributionControl: true
        });

        map.addControl(new maplibregl.NavigationControl(), 'top-right');
        map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');

        // ── ベースマップ切替 ──────────────────────────────────────
        function setBasemap(type) {
            if (type === 'satellite') {
                map.setLayoutProperty('satellite-layer', 'visibility', 'visible');
                map.setLayoutProperty('map-layer', 'visibility', 'none');
                document.getElementById('btnSatellite').classList.add('active');
                document.getElementById('btnMap').classList.remove('active');
            } else {
                map.setLayoutProperty('satellite-layer', 'visibility', 'none');
                map.setLayoutProperty('map-layer', 'visibility', 'visible');
                document.getElementById('btnSatellite').classList.remove('active');
                document.getElementById('btnMap').classList.add('active');
            }
        }

        // ── カテゴリ→色のマッチ式を生成 ──────────────────────────
        function buildColorExpression() {
            const expr = ['match', ['get', 'category']];
            for (const [key, val] of Object.entries(cropStyles)) {
                expr.push(key, val.color);
            }
            expr.push('#888888'); // fallback
            return expr;
        }

        // ── マップロード後の処理 ──────────────────────────────────
        map.on('load', function () {
            fetch('data/crop_sample.geojson')
                .then(r => r.json())
                .then(geojson => {
                    // GeoJSONソース追加（generateId でホバー用IDを自動付与）
                    map.addSource('crops', {
                        type: 'geojson',
                        data: geojson,
                        generateId: true
                    });

                    // 塗りつぶしレイヤー
                    map.addLayer({
                        id: 'crops-fill',
                        type: 'fill',
                        source: 'crops',
                        paint: {
                            'fill-color': buildColorExpression(),
                            'fill-opacity': [
                                'case',
                                ['boolean', ['feature-state', 'hover'], false],
                                0.75,
                                0.45
                            ]
                        }
                    });

                    // アウトラインレイヤー
                    map.addLayer({
                        id: 'crops-outline',
                        type: 'line',
                        source: 'crops',
                        paint: {
                            'line-color': buildColorExpression(),
                            'line-width': [
                                'case',
                                ['boolean', ['feature-state', 'hover'], false],
                                3,
                                1.5
                            ],
                            'line-opacity': 0.9
                        }
                    });

                    buildLegend();
                    buildFilters();
                    buildStats(geojson);
                    setupInteractions();
                })
                .catch(err => console.error('GeoJSON読み込みエラー:', err));
        });

        // ── 凡例を生成 ────────────────────────────────────────────
        function buildLegend() {
            document.getElementById('legend-content').innerHTML =
                Object.entries(cropStyles).map(([, val]) =>
                    `<div class="legend-item">
                        <div class="legend-swatch" style="background:${val.color}"></div>
                        <span>${val.label}</span>
                    </div>`
                ).join('');
        }

        // ── フィルターチェックボックスを生成 ──────────────────────
        function buildFilters() {
            document.getElementById('crop-filters').innerHTML =
                Object.entries(cropStyles).map(([key, val]) =>
                    `<div class="crop-filter-row">
                        <div class="crop-filter-swatch" style="background:${val.color}"></div>
                        <input type="checkbox" id="filter-${key}" checked
                               onchange="toggleFilter('${key}')">
                        <label for="filter-${key}">${val.label}</label>
                    </div>`
                ).join('');
        }

        // ── フィルター切替 ────────────────────────────────────────
        function toggleFilter(category) {
            cropFilters[category] = document.getElementById(`filter-${category}`).checked;
            const active = Object.entries(cropFilters).filter(([, v]) => v).map(([k]) => k);
            const filterExpr = active.length > 0
                ? ['in', ['get', 'category'], ['literal', active]]
                : ['==', '1', '0'];
            ['crops-fill', 'crops-outline'].forEach(id => map.setFilter(id, filterExpr));
        }

        // ── 統計パネルを生成 ──────────────────────────────────────
        function buildStats(geojson) {
            const totals = {};
            let totalArea = 0;

            for (const f of geojson.features) {
                const cat = f.properties.category;
                const area = f.properties.area_sqm || 0;
                if (!totals[cat]) totals[cat] = { count: 0, area: 0 };
                totals[cat].count++;
                totals[cat].area += area;
                totalArea += area;
            }

            const rows = Object.entries(totals)
                .sort((a, b) => b[1].area - a[1].area)
                .map(([cat, data]) => {
                    const style = cropStyles[cat] || { label: cat, color: '#888' };
                    return `<div class="stat-row">
                        <div class="stat-label">
                            <div class="stat-swatch" style="background:${style.color}"></div>
                            ${style.label}
                        </div>
                        <div class="stat-value">${(data.area / 10000).toFixed(1)} ha</div>
                    </div>`;
                }).join('');

            document.getElementById('stats-content').innerHTML = `
                <div class="stat-row">
                    <div class="stat-label">圃場数</div>
                    <div class="stat-value">${geojson.features.length} 枚</div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">総面積</div>
                    <div class="stat-value">${(totalArea / 10000).toFixed(1)} ha</div>
                </div>
                ${rows}
            `;
        }

        // ── クリック・ホバー操作 ──────────────────────────────────
        let hoveredId = null;
        const popup = new maplibregl.Popup({ closeButton: true, maxWidth: '260px' });

        function setupInteractions() {
            // マウスオーバー：ハイライト
            map.on('mousemove', 'crops-fill', e => {
                map.getCanvas().style.cursor = 'pointer';
                if (hoveredId !== null) {
                    map.setFeatureState({ source: 'crops', id: hoveredId }, { hover: false });
                }
                hoveredId = e.features[0].id;
                map.setFeatureState({ source: 'crops', id: hoveredId }, { hover: true });
            });

            map.on('mouseleave', 'crops-fill', () => {
                map.getCanvas().style.cursor = '';
                if (hoveredId !== null) {
                    map.setFeatureState({ source: 'crops', id: hoveredId }, { hover: false });
                    hoveredId = null;
                }
            });

            // クリック：詳細ポップアップ
            map.on('click', 'crops-fill', e => {
                const props = e.features[0].properties;
                const style = cropStyles[props.category] || { label: props.category, color: '#888' };
                const pct = Math.round(props.score * 100);
                const ha = (props.area_sqm / 10000).toFixed(2);

                const noteHtml = props.notes
                    ? `<div class="popup-note">${props.notes}</div>`
                    : '';

                popup
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <div class="popup-header">
                            <div class="popup-color-bar" style="background:${style.color}"></div>
                            <div>
                                <div class="popup-crop-name">${style.label}</div>
                                <div class="popup-score-label">AI識別信頼度 ${pct}%</div>
                            </div>
                        </div>
                        <div class="confidence-bar-wrap">
                            <div class="confidence-bar-fill"
                                 style="width:${pct}%; background:${style.color}"></div>
                        </div>
                        <div class="popup-row">
                            <span class="popup-key">圃場面積</span>
                            <span class="popup-val">${ha} ha</span>
                        </div>
                        <div class="popup-row">
                            <span class="popup-key">調査日</span>
                            <span class="popup-val">${props.survey_date || '不明'}</span>
                        </div>
                        ${noteHtml}
                    `)
                    .addTo(map);
            });

            // 圃場外クリックでポップアップを閉じる
            map.on('click', e => {
                const hits = map.queryRenderedFeatures(e.point, { layers: ['crops-fill'] });
                if (hits.length === 0) popup.remove();
            });
        }
    </script>
</body>

</html>
